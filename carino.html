  });
  // Esc cierra la ventana, como en Cargo
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.querySelector('[rel="close-overlay"]')) location.href = "index.html";
  });
  // videos de fondo: forzar reproducción muda
  document.querySelectorAll("video").forEach(function (v) {
    v.muted = true;
    var p = v.play && v.play();
    if (p && p.catch) p.catch(function () {});
  });
  // medidas: la captura quedó fija a 1436x896, se recalculan con la ventana real (como hace Cargo)
  var CAP_H = 896;
  var fits = [].map.call(document.querySelectorAll("bodycopy"), function (b) {
    return parseFloat(b.style.getPropertyValue("--fit-height")) || 0;
  });
  var st = document.createElement("style");
  st.textContent = "[style*='--backdrop-width']{--backdrop-width:100vw!important;--backdrop-height:100vh!important}" +
    "[style*='--backdrop-width'] div, [style*='--backdrop-width'] video{width:100%!important;height:100%!important}" +
    "[style*='--backdrop-width'] video{object-fit:cover}";
  document.head.appendChild(st);
  function layout() {
    var h = window.innerHeight, root = document.documentElement.style;
    // Cargo marca <html class="mobile"> en celulares; de eso dependen los estilos móviles del sitio
    var isMobile = window.matchMedia("(max-width: 767px)").matches;
    document.documentElement.classList.toggle("mobile", isMobile);
    ["--visible-viewport-height", "--viewport-height", "--min-viewport-height"].forEach(function (k) { root.setProperty(k, h + "px"); });
    // Cargo: 1.44% del alto en escritorio, 2.24% del ancho en celular
    root.setProperty("--base-size", (isMobile ? window.innerWidth * 0.0224 : h * 0.0144) + "px");
    // galerías: el alto de cada imagen quedó en px; se recalcula con su proporción real
    document.querySelectorAll("gallery-grid media-item, gallery-justify media-item, gallery-columnized media-item, gallery-slideshow media-item").forEach(fitFrame);
    document.querySelectorAll("bodycopy").forEach(function (b, i) {
      b.style.setProperty("--resize-parent-width", b.clientWidth + "px");
      if (fits[i]) b.style.setProperty("--fit-height", (fits[i] * h / CAP_H) + "px");
    });
    // escritorio freeform: Cargo ubica cada ícono en % del ancho (freeform-x/y/scale)
    galleries.forEach(function (g) {
      var w = g.el.clientWidth;
      if (g.ratio) g.el.style.setProperty("height", (g.ratio * w) + "px", "important");
      g.el.querySelectorAll("media-item[freeform-x]").forEach(function (m) {
        var x = parseFloat(m.getAttribute("freeform-x")) || 0, y = parseFloat(m.getAttribute("freeform-y")) || 0,
            sc = parseFloat(m.getAttribute("freeform-scale")) || 0;
        if (sc) m.style.setProperty("width", (sc / 100 * w) + "px", "important");
        m.style.setProperty("--base-translate", "translate(" + (x / 100 * w) + "px, " + (y / 100 * w) + "px)", "important");
      });
    });
  }
  function fitFrame(m) {
    var w = m.clientWidth, ratio = 0;
    var aw = parseFloat(m.getAttribute("width")), ah = parseFloat(m.getAttribute("height"));
    var img = m.shadowRoot && m.shadowRoot.querySelector("img");
    if (img && img.naturalWidth > 1) ratio = img.naturalHeight / img.naturalWidth;
    else if (aw && ah) ratio = ah / aw;
    else if (img && !img.dataset.fitWait) {
      img.dataset.fitWait = "1";
      img.addEventListener("load", function () { fitFrame(m); });
    }
    if (w && ratio) m.style.setProperty("--frame-padding", (w * ratio) + "px", "important");
  }
  // columnas: en la captura quedaron en px; se pasan a proporciones y en celular se apilan como en Cargo
  var columnSets = [].map.call(document.querySelectorAll("column-set"), function (cs) {
    var css = cs.shadowRoot ? cs.shadowRoot.innerHTML : "", widths = {};
    css.replace(/column-unit\[slot="(\d+)"\]\)\s*{\s*--column-width:\s*([\d.]+)px/g, function (_, slot, w) { widths[slot] = parseFloat(w); });
    return { el: cs, widths: widths };
  });
  function layoutColumns() {
    var mobile = window.matchMedia("(max-width: 767px)").matches;
    columnSets.forEach(function (c) {
      var units = [].filter.call(c.el.children, function (u) { return u.tagName === "COLUMN-UNIT"; });
      var total = units.reduce(function (t, u) { return t + (c.widths[u.getAttribute("slot")] || 0); }, 0);
      c.el.style.setProperty("flex-wrap", mobile ? "wrap" : "nowrap", "important");
      units.forEach(function (u, i) {
        var w = c.widths[u.getAttribute("slot")] || 0;
        var val = mobile || !total ? "100%"
          : "calc((100% - " + (13 * (units.length - 1)) + "px) * " + (w / total) + ")";
        u.style.setProperty("--column-width", val, "important");
        u.style.setProperty("--resize-parent-width", mobile ? c.el.clientWidth + "px" : "", "important");
        u.style.setProperty("margin-right", mobile || i === units.length - 1 ? "0" : "13px", "important");
        u.style.setProperty("margin-bottom", mobile && i < units.length - 1 ? "13px" : "0", "important");
      });
    });
  }
  // relación alto/ancho original de cada escritorio freeform, sacada de la captura
  var galleries = [].map.call(document.querySelectorAll("gallery-freeform"), function (el) {
    var css = el.shadowRoot ? el.shadowRoot.innerHTML : "", ratio = 0;
    var hm = css.match(/:host\s*{[^}]*?height:\s*([\d.]+)px/);
    var first = el.querySelector("media-item[freeform-scale][slot]");
    if (hm && first) {
      var wm = css.match(new RegExp('slot="' + first.getAttribute("slot") + '"\\]\\)\\s*{\\s*width:\\s*([\\d.]+)px'));
      var sc = parseFloat(first.getAttribute("freeform-scale"));
      if (wm && sc) ratio = parseFloat(hm[1]) / (parseFloat(wm[1]) / (sc / 100));
    }
    return { el: el, ratio: ratio };
  });
  layoutColumns();
  layout();
  window.addEventListener("resize", function () { layoutColumns(); layout(); });
  // reloj (texto de la barra de menú y digital-clock)
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  function tick() {
    var d = new Date();
    document.querySelectorAll("digital-clock").forEach(function (c) {
      var r = c.shadowRoot; if (!r) return;
      // la captura dejó el texto viejo en ::before; se apaga y se escribe el actual
      if (!r.querySelector("style[data-live]")) {
        var s0 = document.createElement("style"); s0.setAttribute("data-live", "");
        s0.textContent = ["day", "month-name", "day-of-month", "hour", "minute", "period"].map(function (p) {
          return "[part~='" + p + "']::before,[part~='" + p + "']::after";
        }).join(",") + "{content:none!important}";
        r.appendChild(s0);
      }
      var h12 = d.getHours() % 12 || 12, mm = String(d.getMinutes()).padStart(2, "0"), ap = d.getHours() < 12 ? "AM" : "PM";
      var map = { "day": DAYS[d.getDay()], "month-name": MONTHS[d.getMonth()], "day-of-month": d.getDate(),
                  "hour": h12, "minute": mm, "am-pm": ap, "ampm": ap, "period": ap, "year": d.getFullYear() };
      r.querySelectorAll("[part~='section']").forEach(function (s) {
        var key = s.getAttribute("part").replace(" section", "");
        if (key in map) s.textContent = map[key];
      });
    });
  }
  tick(); setInterval(tick, 15000);
})();

</script>
</body></html>
